name: Mac2Seven
options:
  bundleIdPrefix: com.csioly
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.3"
    CURRENT_PROJECT_VERSION: "9"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Mac2Seven:
    type: application
    platform: macOS
    sources:
      - path: Mac2Seven
    dependencies:
      - package: Sparkle
    info:
      path: Mac2Seven/Info.plist
      properties:
        CFBundleDisplayName: Mac2Seven
        CFBundleName: Mac2Seven
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: Mac2Seven uses System Events to shut down, restart, or log out when you choose those options.
        NSHumanReadableCopyright: ""
        # Sparkle automatic updates: the feed is attached to the newest GitHub release.
        SUFeedURL: https://github.com/saoneill01-a11y/Mac2Seven/releases/latest/download/appcast.xml
        SUPublicEDKey: QM9PlLRhLIePVFEAOTnD/RufUnFbaEh0HFgig022LKk=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.csioly.Mac2Seven.app-reference
            UTTypeDescription: Mac2Seven app reference
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: com.csioly.Mac2Seven.folder-reference
            UTTypeDescription: Mac2Seven folder reference
            UTTypeConformsTo: [public.data]
    entitlements:
      path: Mac2Seven/Mac2Seven.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csioly.Mac2Seven
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release builds are signed with the Developer ID certificate (with a secure timestamp)
        # so they can be notarized and opened on any Mac. Debug builds stay ad-hoc signed.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: Z6U97H9M93
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # No debugger attach permission in builds we ship (notarization rejects it).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
